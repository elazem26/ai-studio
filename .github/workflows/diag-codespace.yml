# diag-codespace.yml — Deep diagnosis INSIDE the Codespace for the
# "transplant page shows no result box" report:
#   1. environment (python paths, venv, models)
#   2. services (3000 web, 3030 face-swap mini-service)
#   3. full E2E transplant via the API (login → upload REAL fixture faces →
#      part-transplant mode=head, with retries while models self-heal)
#   4. recent server.log errors
name: diag-codespace

on:
  workflow_dispatch:

concurrency:
  group: diag-codespace
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.CS_KEEPALIVE_TOKEN }}
      CS: disreputable-wizard-px65r97q6xpfrjg4
    steps:
      - name: Deep diagnosis inside Codespace
        run: |
          gh cs ssh -c "$CS" -- 'bash -s' <<'EOF'
          set +e
          echo "===== ENV ====="
          echo "user: $(whoami)"
          echo "venv_z_python: $(ls /home/z/.venv/bin/python3 2>&1)"
          echo "system_python: $(which python3) ($(python3 --version 2>&1))"
          echo "models: $(ls ~/.insightface/models/ 2>&1 | head -4)"
          echo "===== REPO ====="
          cd /workspaces/ai-studio 2>/dev/null || cd /home/z/my-project || exit 1
          echo "cwd: $(pwd)  commit: $(git rev-parse --short HEAD 2>/dev/null)"
          echo "spawn-safe-patch: $(grep -c 'spawnSafe' src/app/api/system/ensure-services/route.ts) spawnSafe in ensure-services"
          echo "===== SERVICES ====="
          echo "web3000: $(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:3000/)"
          echo "health3030: $(curl -s -m 3 http://localhost:3030/health | head -c 150)"
          echo "===== E2E TRANSPLANT (real faces, mode=head) ====="
          python3 - <<'PYEOF'
          import io, json, time, urllib.request, urllib.error, os

          BASE = "http://localhost:3000"
          ROOT = os.getcwd()
          SRC = os.path.join(ROOT, "tests", "fixtures", "face-source.png")
          REF = os.path.join(ROOT, "tests", "fixtures", "face-ref.png")

          def post(path, data=None, raw=None, timeout=140):
              req = urllib.request.Request(BASE + path,
                  data=(raw if raw is not None else json.dumps(data).encode()),
                  headers={} if raw is not None else {"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return 0, str(e)

          print("login:", post("/api/auth/login", {"email": "mohamed", "password": "1970"})[0])

          def upload(png, name):
              b = "----diag456"
              body = (f"--{b}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"{name}\"\r\n"
                      f"Content-Type: image/png\r\n\r\n").encode() + png + f"\r\n--{b}--\r\n".encode()
              s, txt = post("/api/images/upload", raw=body, timeout=60)
              try:
                  return json.loads(txt).get("path")
              except Exception:
                  print("upload fail:", s, txt[:200])
                  return None

          src = upload(open(SRC, "rb").read(), "source.png")
          ref = upload(open(REF, "rb").read(), "ref.png")
          print("paths:", src, ref)
          if not (src and ref):
              print("E2E FAIL: uploads failed"); raise SystemExit

          for attempt in range(1, 4):
              s, txt = post("/api/images/part-transplant", {
                  "sourcePath": src, "refPath": ref, "mode": "head",
                  "region": "full", "scale": 1.0, "colorStrength": 0.6}, timeout=150)
              head = txt[:220].replace("\n", " ")
              print(f"TRANSPLANT try{attempt}: {s} {head}")
              if s == 200 and '"url"' in txt:
                  print("E2E PASS: result url returned → result box will appear")
                  break
              time.sleep(25)  # models self-heal (buffalo/inswapper) — retry
          else:
              print("E2E FAIL: transplant did not return a result after 3 tries")
          PYEOF
          echo "===== RECENT LOG ====="
          tail -c 800 data/server.log 2>/dev/null | tail -8
          echo "===== DONE ====="
          EOF
